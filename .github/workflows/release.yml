name: Release

# On a push to main that adds changelog.d/ fragments, scripts/release.js turns
# them into the next version (VERSION, package.json, package-lock.json and a
# CHANGELOG.md section) and this job commits that back to main. Then, whenever
# VERSION has no vX tag yet, it tags the commit that last changed VERSION and
# publishes a GitHub Release whose notes are CHANGELOG.md's "## [X]" section,
# and the npm job publishes that version. A PR that bumped VERSION by hand
# (the old convention) is still released as-is.
#
# No loop: the commit back is pushed with GITHUB_TOKEN, and GitHub starts no
# workflow runs for GITHUB_TOKEN pushes; the actor check below is a second
# guard. Runs queue instead of overlapping, and each one checks out the tip of
# main, so fragments from merges that land close together go out together.

on:
  push:
    branches: [main]
    paths: [VERSION, 'changelog.d/**']

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.tag.outputs.sha }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Turn changelog.d fragments into a version
        run: |
          v="$(node scripts/release.js)"
          if [ -z "$v" ]; then echo "No changelog.d fragments"; exit 0; fi
          # The merge's own subject, minus any "vX type:" prefix, so the
          # Release title below reads the PR's headline.
          headline="$(git log -1 --format=%s | sed -E 's/^(v[0-9.]+ )?[a-z]+(\([^)]*\))?!?: //')"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A VERSION package.json package-lock.json CHANGELOG.md changelog.d
          git commit -m "v$v release: $headline"
          # A merge that landed since checkout never touches these files, so
          # the rebase is clean; its own run is queued behind this one.
          git push origin HEAD:main || { git pull --rebase origin main && git push origin HEAD:main; }

      - name: Create the tag and Release
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="$(tr -d '[:space:]' < VERSION)"
          sha="$(git log -1 --format=%H -- VERSION)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" > /dev/null 2>&1 || git ls-remote --exit-code --tags origin "refs/tags/v$v" > /dev/null; then
            echo "v$v already exists"; exit 0
          fi
          awk -v h="## [$v]" 'index($0, h) == 1 { on = 1; next } on && /^## \[/ { exit } on' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "CHANGELOG.md has no section for $v"; exit 1; fi
          headline="$(git log -1 --format=%s "$sha" | sed -E 's/^(v[0-9.]+ )?[a-z]+(\([^)]*\))?!?: //; s/ \(#[0-9]+\)$//')"
          gh release create "v$v" --target "$sha" --title "v$v — $headline" --notes-file notes.md

  # Publish the same version to npm with Trusted Publishing (OIDC): no token
  # secret, npm trusts this workflow in this repo. A separate job so an npm
  # failure (trusted publisher not set up yet, registry down) never holds back
  # the GitHub Release above. Re-runs are safe: a version already on npm is
  # skipped.
  npm:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write

    steps:
      # The release commit, not the pushed one: the job above may have
      # committed the version on top of it.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.sha }}

      # Trusted publishing needs npm 11.5.1+, which Node 24 ships.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Publish to npm
        run: |
          # npm needs three-part semver and VERSION is four-part. package.json
          # carries A.B.C (what scripts/release.js writes); npm gets
          # A.B.(C*1000+D) so every MICRO release is published too. See
          # CONTRIBUTING.md "Versions".
          v="$(tr -d '[:space:]' < VERSION)"
          IFS=. read -r a b c d <<< "$v"
          have="$(node -p "require('./package.json').version")"
          if [ "$have" != "$a.$b.$c" ]; then
            echo "package.json version is $have, but VERSION is $v (expected $a.$b.$c)"; exit 1
          fi
          npmv="$a.$b.$((10#$c * 1000 + 10#$d))"
          name="$(node -p "require('./package.json').name")"
          if [ "$(npm view "$name@$npmv" version 2>/dev/null)" = "$npmv" ]; then
            echo "$name@$npmv is already on npm"; exit 0
          fi
          npm pkg set version="$npmv"
          npm publish --provenance --access public
